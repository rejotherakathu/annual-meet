<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5d3b">
<meta name="robots" content="noindex">
<title>Annual Day 2026 Volunteer Scanner</title>
<script src="vendor/html5-qrcode.min.js"></script>
<style>
  :root {
    --brand: #0b5d3b; --bg: #f4f6f8; --panel: #ffffff; --line: #d7dde3; --text: #1f2933; --muted: #5f6b76;
    --ok: #1b5e20; --warn: #b26a00; --bad: #b71c1c; --info: #0d47a1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); min-height: 100vh; }
  header { background: var(--brand); color: #fff; }
  header .in { max-width: 520px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header h1 { font-size: 17px; margin: 0; }
  header .org { font-size: 12px; opacity: .85; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 14px 16px 32px; }
  .pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.18); white-space: nowrap; }
  .pill.warn { background: #f59e0b; color: #1f2933; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input { width: 100%; padding: 13px; font-size: 16px; border-radius: 8px; border: 1px solid #c3ccd5; background: #fff; color: var(--text); }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 12px 14px; background: #e3e8ed; color: var(--text); }
  button.primary { background: var(--brand); color: #fff; font-weight: 700; }
  button:disabled { opacity: .5; cursor: default; }
  .full { width: 100%; margin-top: 14px; }
  .err { color: var(--bad); font-size: 14px; min-height: 1.2em; margin-top: 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  .hidden { display: none !important; }
  .bar { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .gate { font-size: 22px; font-weight: 800; color: var(--brand); }
  #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; min-height: 240px; }
  #result { border-radius: 12px; padding: 18px; margin: 12px 0; text-align: center; background: var(--panel); border: 1px solid var(--line); }
  #result .big { font-size: 26px; font-weight: 800; }
  #result .name { font-size: 22px; font-weight: 700; margin-top: 6px; }
  #result .sub { font-size: 15px; margin-top: 4px; }
  #result .meta { font-size: 13px; opacity: .9; margin-top: 6px; }
  #result.OK, #result.DUPLICATE, #result.NOT_FOUND, #result.BLOCKED, #result.ERROR, #result.QUEUED { color: #fff; border-color: transparent; }
  #result.OK { background: var(--ok); }
  #result.DUPLICATE { background: var(--warn); }
  #result.NOT_FOUND, #result.BLOCKED, #result.ERROR { background: var(--bad); }
  #result.QUEUED { background: var(--info); }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  ul.history { list-style: none; padding: 0; margin: 0; }
  ul.history li { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  ul.history li:last-child { border-bottom: 0; }
  .tag { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; white-space: nowrap; color: #fff; }
  .tag.OK { background: var(--ok); } .tag.DUPLICATE { background: var(--warn); }
  .tag.NOT_FOUND, .tag.BLOCKED, .tag.ERROR { background: var(--bad); } .tag.QUEUED { background: var(--info); }
  #syncErr { font-size: 13px; color: var(--warn); margin-top: 6px; }
</style>
</head>
<body>
<header>
  <div class="in">
    <div>
      <h1>Annual Day 2026</h1>
      <div class="org">Sreedhareeyam Ayurveda Group · Volunteer Scanner</div>
    </div>
    <span id="netPill" class="pill">Online</span>
  </div>
</header>

<div class="wrap">
  <!-- Misconfiguration -->
  <section id="screenConfig" class="card hidden">
    <div style="font-weight:700">Scanner not configured</div>
    <p class="muted">The Apps Script web app URL has not been set in this page. Contact the organiser.</p>
  </section>

  <!-- Sign-in -->
  <section id="screenLogin" class="card hidden">
    <div style="font-weight:700">Volunteer sign-in</div>
    <label for="volId">Volunteer ID</label>
    <input id="volId" autocomplete="username" autocapitalize="characters" spellcheck="false" maxlength="20">
    <label for="volPin">6-digit PIN</label>
    <input id="volPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="current-password">
    <div id="loginErr" class="err"></div>
    <button id="loginBtn" class="primary full">Sign in</button>
  </section>

  <!-- Scanner -->
  <section id="screenScan" class="hidden">
    <div class="bar">
      <div>
        <div class="muted">Scanning at</div>
        <div id="gateLabel" class="gate"></div>
      </div>
      <button id="signOutBtn">Sign out</button>
    </div>
    <div id="reader"></div>
    <div id="camErr" class="err"></div>
    <div id="result"><div class="big">Ready</div><div class="sub">Point the camera at the badge QR code</div></div>
    <div class="card">
      <label for="manualCode" style="margin-top:0">Can't scan? Enter the Badge ID printed under the QR</label>
      <div class="row">
        <input id="manualCode" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button id="manualBtn" class="primary">Check</button>
      </div>
    </div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:6px">Recent scans on this phone</div>
      <ul id="history" class="history"></ul>
      <div id="syncErr" class="hidden"></div>
    </div>
    <p class="muted" id="whoami"></p>
  </section>
</div>

<script>
// ===========================================================================
// SETUP: the production Apps Script Web app URL (ends in /exec).
// The project must include apps-script/ScannerApi.gs (adds doPost) and be
// redeployed as a new version of this same deployment.
// ===========================================================================
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxROQJC14ibupzkt3sr6futuWnm9pfmhnXeVyvcWm7ETstThxe4wxUWDZ85LdvVRus50Q/exec';

const CONFIGURED = /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(SCRIPT_URL);
// Volunteer role (Volunteers tab) → recordBadgeAction action and label.
const ROLE_ACTION = { GATE: { action: 'gate', label: 'Entry gate', verb: 'Entry' }, MEAL: { action: 'food', label: 'Meal counter', verb: 'Meal' } };
const COOLDOWN_MS = 1800;        // camera pause after each scan so the result can be read
const SAME_CODE_MS = 5000;       // ignore the same QR still held in front of the camera
const SYNC_EVERY_MS = 15000;     // retry queued scans this often
const REQUEST_TIMEOUT_MS = 30000; // recordBadgeAction can wait up to 20 s for its lock

// ---------- storage (never fatal if blocked) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('ad26.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ad26.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('ad26.' + k); } catch (e) {} },
};

let session = store.get('session', null);   // {token, expiresAt, id, role}
let queue = store.get('queue', []);         // scans not yet confirmed by the server: {code, action, scannedAt}
let history = store.get('history', []);     // recent scans on this phone
let scanner = null, inFlight = false, cooldownUntil = 0, lastCode = '', lastCodeAt = 0, audio = null, wakeLock = null;

const $ = (id) => document.getElementById(id);

// ---------- API ----------
// Offline, timeouts and Google error pages are TransientError: the scan stays
// on the phone and is retried, never lost.
class TransientError extends Error {}

async function api(body) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS);
  try {
    // No custom headers → text/plain "simple" request → no CORS preflight.
    const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(body), signal: ctrl.signal, redirect: 'follow' });
    const text = await res.text();
    try { return JSON.parse(text); }
    catch (e) { throw new TransientError('Unexpected response from server (HTTP ' + res.status + ')'); }
  } catch (e) {
    if (e instanceof TransientError) throw e;
    throw new TransientError(e && e.name === 'AbortError' ? 'Request timed out' : 'No connection');
  } finally { clearTimeout(t); }
}

// ---------- screens ----------
function show(id) {
  ['screenConfig', 'screenLogin', 'screenScan'].forEach(s => $(s).classList.toggle('hidden', s !== id));
}
function sessionValid() { return !!(session && session.token && Date.now() < session.expiresAt && ROLE_ACTION[session.role]); }
function gate() { return ROLE_ACTION[session.role]; }

function route() {
  if (!CONFIGURED) { show('screenConfig'); return; }
  if (!sessionValid()) { stopCamera(); show('screenLogin'); $('volId').value = store.get('lastId', ''); return; }
  $('gateLabel').textContent = gate().label;
  $('whoami').textContent = 'Signed in as ' + session.id + ' (' + session.role + '). Session ends ' +
    new Date(session.expiresAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '.';
  show('screenScan');
  renderHistory();
  startCamera();
  keepAwake();
}

$('loginBtn').onclick = async () => {
  const volunteerId = $('volId').value.trim().toUpperCase(), pin = $('volPin').value.trim();
  $('loginErr').textContent = '';
  if (!volunteerId) { $('loginErr').textContent = 'Enter your Volunteer ID.'; return; }
  if (!/^[0-9]{6}$/.test(pin)) { $('loginErr').textContent = 'PIN must be 6 digits.'; return; }
  $('loginBtn').disabled = true; $('loginBtn').textContent = 'Signing in…';
  try {
    const r = await api({ op: 'login', volunteerId, pin });
    if (!r.ok) { $('loginErr').textContent = r.message || 'Sign-in failed'; return; }
    if (!ROLE_ACTION[r.role]) { $('loginErr').textContent = 'Role "' + r.role + '" cannot use the scanner.'; return; }
    session = { token: r.sessionToken, expiresAt: Date.now() + (Number(r.expiresInSeconds) || 0) * 1000, id: r.volunteerId, role: r.role };
    store.set('session', session); store.set('lastId', r.volunteerId);
    $('volPin').value = '';
    unlockAudio();
    route();
    syncQueue();
  } catch (e) {
    $('loginErr').textContent = 'Could not reach the server (' + e.message + '). Check the internet connection and try again.';
  } finally { $('loginBtn').disabled = false; $('loginBtn').textContent = 'Sign in'; }
};
$('volPin').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });

function signOut(message) {
  const old = session;
  session = null; store.del('session');
  if (old && old.token) api({ op: 'logout', session: old.token }).catch(() => {});
  route();
  if (message) $('loginErr').textContent = message;
}
$('signOutBtn').onclick = () => {
  if (queue.length && !confirm(queue.length + ' scan(s) are still waiting to sync. They stay on this phone and sync after the next sign-in with the same role. Sign out?')) return;
  signOut();
};

// ---------- camera ----------
async function startCamera() {
  $('camErr').textContent = '';
  if (scanner && scanner.isScanning) return;
  if (!window.Html5Qrcode) { $('camErr').textContent = 'Scanner library failed to load. Reload the page.'; return; }
  if (!scanner) scanner = new Html5Qrcode('reader', { formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE], verbose: false });
  try {
    await scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; } },
      (text) => onCode(text, 'camera'),
      () => {}
    );
  } catch (e) {
    const msg = String(e && (e.name || e.message) || e);
    $('camErr').textContent = /NotAllowed|Permission/i.test(msg)
      ? 'Camera permission denied. Allow camera access for this site in browser settings, then reload.'
      : /NotFound|Overconstrained/i.test(msg) ? 'No camera found. Use Badge ID entry below.'
      : 'Could not start the camera (' + msg + '). Open this link in Chrome or Safari (not inside WhatsApp/Instagram).';
  }
}
async function stopCamera() {
  if (scanner && scanner.isScanning) { try { await scanner.stop(); } catch (e) {} }
}
document.addEventListener('visibilitychange', () => {
  if ($('screenScan').classList.contains('hidden')) return;
  if (document.hidden) { stopCamera(); } else { startCamera(); keepAwake(); syncQueue(); }
});
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
}

$('manualBtn').onclick = () => { const v = $('manualCode').value.trim(); if (v && !inFlight) { unlockAudio(); onCode(v, 'manual'); $('manualCode').value = ''; } };
$('manualCode').addEventListener('keydown', e => { if (e.key === 'Enter') $('manualBtn').click(); });

// ---------- scanning ----------
// Badge QR = <web app URL>?t=<TOKEN>. Keep just the token for display/dedupe;
// the server also accepts a typed Badge ID.
function normaliseCode(text) {
  text = String(text).trim();
  const m = text.match(/[?&]t=([^&#]+)/);
  if (m) { try { text = decodeURIComponent(m[1]); } catch (e) { text = m[1]; } }
  return text.trim().toUpperCase();
}

async function onCode(raw, source) {
  const code = normaliseCode(raw);
  const now = Date.now();
  if (inFlight || !code) return;
  if (source === 'camera' && (now < cooldownUntil || (code === lastCode && now - lastCodeAt < SAME_CODE_MS))) return;
  if (!sessionValid()) { signOut('Session expired. Please sign in again.'); return; }
  inFlight = true; lastCode = code; lastCodeAt = now;
  showResult('BUSY', { big: 'Checking…', sub: code });

  const action = gate().action;
  try {
    const r = await api({ op: 'scan', session: session.token, action, code });
    if (r.result === 'SERVER_ERROR') { queueScan(code, action, r.message); return; }
    if (r.result === 'SESSION') { queueScan(code, action, r.message); signOut(r.message); return; }
    handleResult(r, code, action);
  } catch (e) {
    queueScan(code, action, e.message);
  } finally {
    inFlight = false; cooldownUntil = Date.now() + COOLDOWN_MS;
  }
}

function attendeeLines(a) {
  if (!a) return {};
  const rel = a.relationship === 'Staff' || !a.relationship ? (a.relationship || '') : a.relationship + (a.staff ? ' of ' + a.staff : '');
  return {
    name: a.name || '(no name)',
    sub: [rel, a.department].filter(Boolean).join(' · '),
    meta: [a.badgeId ? 'Badge ' + a.badgeId : '', a.age !== '' && a.age != null ? 'Age ' + a.age : ''].filter(Boolean).join(' · '),
  };
}

function handleResult(r, code, action) {
  const L = attendeeLines(r.attendee), verb = verbOf(action);
  if (r.result === 'OK') {
    showResult('OK', { big: '✓ ' + (action === 'gate' ? 'ENTRY OK' : 'MEAL OK'), name: L.name, sub: L.sub, meta: L.meta }); feedback(true);
  } else if (r.result === 'DUPLICATE') {
    const when = action === 'gate' ? r.entryText : r.mealText;
    showResult('DUPLICATE', { big: action === 'gate' ? 'ALREADY ENTERED' : 'MEAL ALREADY SERVED', name: L.name, sub: when ? 'at ' + when : L.sub, meta: L.meta }); feedback(false);
  } else if (r.result === 'BLOCKED') {
    showResult('BLOCKED', { big: '✗ BADGE NOT ACTIVE', name: L.name, sub: 'Do not admit. Refer to the help desk.', meta: L.meta }); feedback(false);
  } else if (r.result === 'NOT_FOUND') {
    showResult('NOT_FOUND', { big: '✗ NOT A VALID BADGE', sub: 'Not on the attendee list', meta: code }); feedback(false);
  } else {
    showResult('ERROR', { big: verb + ' not recorded', sub: r.message || 'Unexpected response', meta: code }); feedback(false);
  }
  addHistory({ code, action, result: r.result || 'ERROR', name: (r.attendee && r.attendee.name) || '', at: Date.now() });
}
function verbOf(action) { return action === 'gate' ? 'Entry' : 'Meal'; }

// ---------- offline / retry queue ----------
function queueScan(code, action, reason) {
  // Without the server only duplicates seen on this phone can be caught.
  const seen = history.find(h => h.code === code && h.action === action && (h.result === 'OK' || h.result === 'QUEUED'));
  if (seen) {
    showResult('DUPLICATE', { big: 'Already scanned on this phone', name: seen.name, sub: verbOf(action) + ' at ' + fmt(seen.at) + (seen.result === 'QUEUED' ? ' (not yet synced)' : '') });
    feedback(false);
    return;
  }
  queue.push({ code, action, scannedAt: new Date().toISOString() });
  store.set('queue', queue);
  showResult('QUEUED', { big: 'Saved on phone', sub: 'Server not reachable (' + reason + '). Allow ' + verbOf(action).toLowerCase() + '. This scan syncs automatically.', meta: code });
  feedback(true);
  addHistory({ code, action, result: 'QUEUED', name: '', at: Date.now() });
  updateNet();
}

let syncing = false;
async function syncQueue() {
  if (syncing || !queue.length || !sessionValid()) { updateNet(); return; }
  syncing = true;
  let error = '';
  const action = gate().action;
  try {
    // Only this volunteer's gate type can be synced with this session; others wait.
    for (let i = 0; i < queue.length; ) {
      const item = queue[i];
      if (item.action !== action) { i++; continue; }
      let r;
      try { r = await api({ op: 'scan', session: session.token, action: item.action, code: item.code }); }
      catch (e) { error = e.message; break; }
      if (r.result === 'SERVER_ERROR') { error = r.message; break; }
      if (r.result === 'SESSION') { error = r.message; signOut(r.message); break; }
      queue.splice(i, 1);
      store.set('queue', queue);
      const h = history.find(x => x.result === 'QUEUED' && x.code === item.code && x.action === item.action);
      if (h) { h.result = r.result || 'ERROR'; h.name = (r.attendee && r.attendee.name) || ''; }
    }
  } finally {
    store.set('queue', queue); store.set('history', history);
    syncing = false;
    const mine = session ? queue.filter(q => q.action === action).length : queue.length;
    $('syncErr').classList.toggle('hidden', !mine);
    $('syncErr').textContent = mine ? mine + ' scan(s) waiting to sync.' + (error ? ' Last error: ' + error : '') : '';
    updateNet(); renderHistory();
  }
}
setInterval(syncQueue, SYNC_EVERY_MS);
window.addEventListener('online', () => { updateNet(); syncQueue(); });
window.addEventListener('offline', updateNet);

function updateNet() {
  const p = $('netPill');
  const off = !navigator.onLine;
  p.className = 'pill' + (off || queue.length ? ' warn' : '');
  p.textContent = (off ? 'Offline' : 'Online') + (queue.length ? ' · ' + queue.length + ' to sync' : '');
}

// ---------- UI helpers ----------
function showResult(cls, o) {
  const el = $('result');
  el.className = cls;
  el.innerHTML = '';
  const add = (c, t) => { if (!t) return; const d = document.createElement('div'); d.className = c; d.textContent = t; el.appendChild(d); };
  add('big', o.big); add('name', o.name); add('sub', o.sub); add('meta', o.meta);
}

function addHistory(h) {
  history.unshift(h);
  history = history.slice(0, 300);
  store.set('history', history);
  renderHistory();
}
function renderHistory() {
  const ul = $('history'); ul.innerHTML = '';
  const action = session && ROLE_ACTION[session.role] ? gate().action : null;
  const items = history.filter(h => h.action === action).slice(0, 15);
  if (!items.length) { const li = document.createElement('li'); li.className = 'muted'; li.textContent = 'No scans yet.'; ul.appendChild(li); return; }
  items.forEach(h => {
    const li = document.createElement('li');
    const left = document.createElement('span'); left.textContent = fmt(h.at) + '  ' + (h.name || h.code);
    const tag = document.createElement('span'); tag.className = 'tag ' + h.result; tag.textContent = h.result.replace('_', ' ');
    li.append(left, tag); ul.appendChild(li);
  });
}
function fmt(ms) { return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

// Beep + vibrate so volunteers don't have to read the screen in a queue.
function unlockAudio() {
  try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch (e) {}
}
function beep(freq, start, dur) {
  const o = audio.createOscillator(), g = audio.createGain();
  o.frequency.value = freq; o.type = 'sine'; g.gain.value = 0.25;
  o.connect(g); g.connect(audio.destination);
  o.start(audio.currentTime + start); o.stop(audio.currentTime + start + dur);
}
function feedback(good) {
  try { if (navigator.vibrate) navigator.vibrate(good ? 120 : [200, 100, 200]); } catch (e) {}
  try { if (!audio) return; if (good) beep(1200, 0, 0.12); else { beep(300, 0, 0.18); beep(300, 0.25, 0.18); } } catch (e) {}
}

// ---------- boot ----------
updateNet();
route();
syncQueue();
</script>
</body>
</html>
