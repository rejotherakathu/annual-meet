<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event QR Badges</title>
<script src="vendor/qrcode.min.js"></script>
<style>
  body { margin: 0; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #0f172a; }
  .controls { max-width: 900px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 4px 0 12px; color: #475569; }
  textarea { width: 100%; box-sizing: border-box; min-height: 160px; font: 13px/1.4 ui-monospace, Menlo, monospace; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 0; background: #0f172a; color: #fff; cursor: pointer; }
  button.secondary { background: #e2e8f0; color: #0f172a; }
  #count { color: #475569; }
  .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; max-width: 900px; margin: 0 auto; padding: 0 16px 24px; }
  .badge { background: #fff; border: 1px dashed #94a3b8; border-radius: 10px; padding: 14px; text-align: center; break-inside: avoid; page-break-inside: avoid; }
  .badge .qr { display: flex; justify-content: center; margin-bottom: 8px; }
  .badge .qr img, .badge .qr canvas { width: 150px; height: 150px; }
  .badge .name { font-weight: 700; font-size: 16px; }
  .badge .cat { font-size: 13px; color: #334155; }
  .badge .tok { font: 10px ui-monospace, Menlo, monospace; color: #64748b; margin-top: 6px; word-break: break-all; }
  @media print {
    body { background: #fff; }
    .controls { display: none; }
    .sheet { grid-template-columns: repeat(3, 1fr); max-width: none; padding: 0; gap: 8mm; }
    .badge { border-color: #000; }
  }
</style>
</head>
<body>
<div class="controls">
  <h1>QR badge generator</h1>
  <p>In the Google Sheet, select the <b>Attendees</b> columns including the header row (at least <b>Token</b> and <b>Name</b>; <b>Category</b> is optional), copy, and paste below. Everything is generated in this browser; nothing is uploaded.</p>
  <textarea id="input" spellcheck="false">Token	Name	Category
DEMO-001	Asha Menon	VIP
DEMO-002	Rahul Nair	Delegate
DEMO-003	Fatima Khan	Delegate
DEMO-004	John Mathew	Speaker
DEMO-005	Lakshmi Iyer	Volunteer</textarea>
  <div class="actions">
    <button id="gen">Generate badges</button>
    <button id="print" class="secondary">Print / Save as PDF</button>
    <span id="count"></span>
  </div>
</div>
<div id="sheet" class="sheet"></div>

<script>
function parse(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];
  const split = l => l.indexOf('\t') !== -1 ? l.split('\t') : l.split(',');
  let cols = { token: 0, name: 1, category: 2 };
  const head = split(lines[0]).map(h => h.trim().toLowerCase());
  if (head.indexOf('token') !== -1) {
    cols = { token: head.indexOf('token'), name: head.indexOf('name'), category: head.indexOf('category') };
    lines.shift();
  }
  return lines.map(l => {
    const c = split(l).map(s => s.trim());
    return { token: c[cols.token] || '', name: cols.name >= 0 ? c[cols.name] || '' : '', category: cols.category >= 0 ? c[cols.category] || '' : '' };
  }).filter(r => r.token);
}

function render() {
  const rows = parse(document.getElementById('input').value);
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = '';
  rows.forEach(r => {
    const card = document.createElement('div'); card.className = 'badge';
    const qr = document.createElement('div'); qr.className = 'qr';
    card.appendChild(qr);
    [['name', r.name], ['cat', r.category], ['tok', r.token]].forEach(([cls, txt]) => {
      if (!txt) return;
      const d = document.createElement('div'); d.className = cls; d.textContent = txt; card.appendChild(d);
    });
    sheet.appendChild(card);
    new QRCode(qr, { text: r.token, width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M });
  });
  document.getElementById('count').textContent = rows.length + ' badge(s)';
}

document.getElementById('gen').onclick = render;
document.getElementById('print').onclick = () => window.print();
render();
</script>
</body>
</html>
